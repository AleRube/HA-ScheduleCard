name: Release

# Crea automaticamente tag e release quando cambia la "version" nel manifest.
on:
  push:
    branches: [main]
    paths: ["custom_components/schedula/manifest.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leggi versione
        id: v
        run: echo "version=$(jq -r .version custom_components/schedula/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Crea release se non esiste
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ steps.v.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION già presente"
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          fi
